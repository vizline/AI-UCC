<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="AI Use Construal & Consequences research study">
  <title>AI-UCC Study</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <noscript><div class="noscript">This study requires JavaScript.</div></noscript>
  <header class="site-header">
    <a class="wordmark" href="#" aria-label="AI-UCC home">AI—UCC</a>
    <div class="study-meta"><span>RESEARCH STUDY</span><span id="progressLabel">00 / 00</span></div>
  </header>

  <main id="app" class="shell" aria-live="polite"></main>

  <footer class="site-footer">
    <span>AI Use Construal &amp; Consequences</span>
    <span>Anonymous research pilot</span>
  </footer>

  <template id="introTemplate">
    <section class="hero panel">
      <p class="eyebrow">Research participation</p>
      <h1>How do people evaluate different ways of completing everyday tasks?</h1>
      <p class="lede">You are invited to take part in an academic study about judgments and decision-making. Participation takes approximately 8–12 minutes.</p>
      <div class="rule"></div>
      <h2>Before you begin</h2>
      <div class="prose">
        <p>You will read one brief situation and answer questions about it. There are no right or wrong answers; we are interested in your honest impressions.</p>
        <p>Your participation is voluntary. You may stop at any time before submitting your answers. We do not ask for your name or email address. Study data will be analysed in aggregate for research purposes.</p>
        <p class="placeholder"><strong>Researcher notice:</strong> Replace this paragraph with the institution, researcher contact, data-retention information, ethics approval number, and complaint/withdrawal procedure approved for the study.</p>
      </div>
      <label class="consent checkbox-row">
        <input type="checkbox" id="consentCheck">
        <span>I am at least 18 years old, I have read the information above, and I voluntarily agree to participate.</span>
      </label>
      <div class="actions"><button class="button primary" id="startButton" disabled>Begin study <span>→</span></button></div>
    </section>
  </template>
</body>
</html>
