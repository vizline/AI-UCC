<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="AI Use Construal & Consequences research study">
  <title>AI-UCC Study</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <noscript><div class="noscript">This study requires JavaScript.</div></noscript>
  <header class="site-header">
    <a class="wordmark" href="#" aria-label="AI-UCC home">AI—UCC</a>
    <div class="study-meta"><span>RESEARCH STUDY</span><span id="progressLabel">00 / 00</span></div>
  </header>

  <main id="app" class="shell" aria-live="polite"></main>

  <footer class="site-footer">
    <span>AI Use Construal &amp; Consequences</span>
    <span>Anonymous research pilot</span>
  </footer>

  <template id="introTemplate">
    <section class="hero panel">
      <p class="eyebrow">Research participation</p>
      <h1>How do people evaluate different ways of completing everyday tasks?</h1>
      <p class="lede">You are invited to take part in an academic study about judgments and decision-making. Participation takes approximately 8–12 minutes.</p>
      <div class="rule"></div>
      <h2>Before you begin</h2>
      <div class="prose">
        <p>This study is conducted by Maciej Koscielniak at SWPS University, Poland. It examines how people evaluate different ways of completing everyday tasks.</p>
        <p>You will read one brief situation and answer questions about it. Participation takes approximately 8–12 minutes. There are no right or wrong answers; we are interested in your honest impressions.</p>
        <p>No risks beyond those of ordinary reflection are anticipated, and there is no direct personal benefit from taking part.</p>
        <p>Participation is voluntary. You may stop at any time before submitting your answers, without giving a reason or facing any disadvantage. We do not ask for your name or email address. Anonymous responses will be analysed in aggregate for scientific research.</p>
      </div>
      <label class="consent checkbox-row">
        <input type="checkbox" id="consentCheck">
        <span>I am at least 18 years old, I have read and understood the information above, and I voluntarily consent to participate.</span>
      </label>
      <div class="actions"><button class="button primary" id="startButton" disabled>Begin study <span>→</span></button></div>
    </section>
  </template>
</body>
</html>
